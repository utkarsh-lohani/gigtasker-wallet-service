databaseChangeLog:
  - changeSet:
      id: create-wallet-transactions-table
      author: utkarsh.lohani
      changes:
        - createTable:
            tableName: wallet_transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true

              - column:
                  name: wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: task_id
                  type: BIGINT

        # Indexes for fast lookup
        - createIndex:
            indexName: idx_wallet_transactions_wallet_id
            tableName: wallet_transactions
            columns:
              - column:
                  name: wallet_id

        - createIndex:
            indexName: idx_wallet_transactions_task_id
            tableName: wallet_transactions
            columns:
              - column:
                  name: task_id

        - createIndex:
            indexName: idx_wallet_transactions_timestamp
            tableName: wallet_transactions
            columns:
              - column:
                  name: timestamp

        - createIndex:
            indexName: idx_wallet_transactions_type
            tableName: wallet_transactions
            columns:
              - column:
                  name: type

      rollback:
        - dropIndex:
            tableName: wallet_transactions
            indexName: idx_wallet_transactions_type

        - dropIndex:
            tableName: wallet_transactions
            indexName: idx_wallet_transactions_timestamp

        - dropIndex:
            tableName: wallet_transactions
            indexName: idx_wallet_transactions_task_id

        - dropIndex:
            tableName: wallet_transactions
            indexName: idx_wallet_transactions_wallet_id

        - dropTable:
            tableName: wallet_transactions
